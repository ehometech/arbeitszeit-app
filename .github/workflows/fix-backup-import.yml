name: Fix backup import/export

on:
  push:
    paths:
      - '.github/workflows/fix-backup-import.yml'
      - '.github/scripts/fix_backup_import.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python .github/scripts/fix_backup_import.py
      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix complete backup import and export"
          git push
